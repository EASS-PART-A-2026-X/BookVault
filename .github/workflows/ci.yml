# Basic CI: lint + tests for each service, then build the images and run the
# Compose smoke test. Needs no secrets: the AI is tested with Pydantic AI's
# TestModel / FunctionModel and the offline keyword model (AI_MODEL=fake).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: book-vault
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # full tag: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: book-vault/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v --cov=app --cov-report=term-missing

  ai-service:
    name: AI service (lint + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # full tag: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . ../eval
      - run: uv run ruff format --check . ../eval
      # No API key anywhere: make sure a real provider can't be reached by accident.
      - run: uv run pytest -v --cov=app --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: ""

  frontend:
    name: Frontend (lint, typecheck, Vitest, build, Playwright e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The e2e run starts the real backend and AI service with `uv run`.
      - uses: astral-sh/setup-uv@v10.4.0  # full tag: setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report (traces, screenshots, videos) on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker (compose build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      # The live-demo override (docs/deploy.md) must stay valid too.
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          SITE_ADDRESS: demo.example.com
      - run: docker compose build
      # Throwaway stack: health, seed, AI search, failure drills, persistence.
      - run: scripts/smoke-test.sh
