# Live-demo overrides: HTTPS in front of the normal stack. See docs/deploy.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --wait
#
# Changes compared with docker-compose.yml alone:
# - caddy: the only public service. It serves HTTPS on 80/443 with automatic
#   certificates and proxies everything to the frontend's nginx.
# - frontend: no longer published on a host port, so it's reachable only through Caddy.
# - backend: COOKIE_SECURE=true, so the session cookie is only ever sent over HTTPS,
#   and reset links point at https://SITE_ADDRESS.
#
# Needs SITE_ADDRESS in .env (the public host name).

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (the public host name, see docs/deploy.md)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and keys; keep them across restarts (Let's Encrypt rate-limits).
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - bookvault
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    ports: !reset []

  backend:
    environment:
      COOKIE_SECURE: "true"
      APP_BASE_URL: https://${SITE_ADDRESS}

volumes:
  caddy-data:
  caddy-config:
