[project]
name = "book-vault-ai"
version = "0.1.0"
description = "Book Vault AI service: natural-language search over a reader's vault, built on Pydantic AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic]>=2.74.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# An application, not an installable library: uv only manages the venv.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
