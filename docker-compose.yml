# Book Vault: full stack with one command.
#
#   docker compose up --build      # app at http://localhost:8080
#   docker compose down            # stop (data is kept in the named volume)
#   docker compose down -v         # stop and delete the data
#
# The browser only talks to the frontend container. nginx serves the React app,
# proxies /api/ai/* to the AI service and /api/* to the backend, all over one
# internal network: the API is same-origin (no CORS) and only port 8080 is published.
#
# Settings come from .env (copy .env.example). With no .env the AI service runs the
# offline keyword model (AI_MODEL=fake), so a fresh clone works without any key.

name: book-vault

services:
  # One-shot job: loads demo readers and sample books into an EMPTY database, then
  # exits. On a volume that already has data it changes nothing (see app/seed.py).
  seed:
    build: ./book-vault
    command: ["python", "-m", "app.seed"]
    environment:
      DATABASE_URL: sqlite:////app/data/books.db
      # Unset -> a random password, printed once by `docker compose logs seed`.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - book-vault-data:/app/data
    # Needs no network: it only writes the SQLite file on the volume.
    network_mode: none
    restart: "no"

  backend:
    build: ./book-vault
    # --root-path tells FastAPI it lives under /api, so its docs work through the
    # proxy (http://localhost:8080/api/docs). nginx strips the prefix.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --root-path=/api
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      DATABASE_URL: sqlite:////app/data/books.db
      # Same-origin through nginx, so no browser origin needs CORS.
      CORS_ORIGINS: ""
      # Password reset emails (see .env.example). Default "console": the email is
      # written to this service's log, which is fine on your own machine only.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${FRONTEND_PORT:-8080}}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - book-vault-data:/app/data
    networks:
      - bookvault
    expose:
      - "8000"
    depends_on:
      # Start only after the seed job finished (it never runs alongside the backend,
      # so SQLite has one writer at a time).
      seed:
        condition: service_completed_successfully
    healthcheck:
      # python:3.11-slim has no curl; /health also checks the database.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status != 200)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      BACKEND_URL: http://backend:8000
      # Unset -> fake (offline keyword model). Set to empty to switch AI off.
      AI_MODEL: ${AI_MODEL-fake}
      # Empty unless set in .env; only the provider named in AI_MODEL needs its key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-5}
      # Search limits (0 = off): per reader per minute and per day, everyone per day.
      AI_LIMIT_PER_MINUTE: ${AI_LIMIT_PER_MINUTE:-10}
      AI_LIMIT_PER_DAY: ${AI_LIMIT_PER_DAY:-100}
      AI_LIMIT_GLOBAL_PER_DAY: ${AI_LIMIT_GLOBAL_PER_DAY:-500}
    networks:
      - bookvault
    expose:
      - "8100"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 200 whenever the service runs; the body says whether AI and the backend are ready.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).status != 200)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - bookvault
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

networks:
  # One shared network; services reach each other by name (backend, ai-service).
  bookvault:

volumes:
  # SQLite lives here and survives `docker compose down` / `up`.
  book-vault-data:
