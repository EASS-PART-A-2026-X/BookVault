# Book Vault frontend: static SPA + reverse proxy to the API.

# Docker's embedded DNS, so the backend's address is looked up at request time:
# nginx starts even if the backend isn't up yet and follows it across restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Own liveness probe for the container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/ai/search -> http://ai-service:8100/search (prefix stripped). Longer prefix,
    # so it wins over /api/ below. The session cookie is forwarded as is.
    location /api/ai/ {
        set $ai http://ai-service:8100;
        rewrite ^/api/ai/(.*)$ /$1 break;
        proxy_pass $ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Longer than AI_TIMEOUT_SECONDS, so the service answers its own 504 first.
        proxy_read_timeout 60s;

        # The AI service sends its own JSON 502/504 (provider error, model timeout):
        # pass those through. Only nginx's own failures (service down) are replaced.
        proxy_intercept_errors off;
        error_page 502 504 = @ai_down;
    }

    location @ai_down {
        default_type application/json;
        return 503 '{"detail":"The AI service is unavailable right now. Try again, or use the filters."}';
    }

    # /api/books -> http://backend:8000/books (prefix stripped).
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Backend down or unresolvable: answer in the API's JSON error shape.
        proxy_intercept_errors on;
        error_page 502 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 502 '{"detail":"Backend unavailable"}';
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (/books/12, /books/new) get index.html and the
    # client-side router takes over. index.html itself is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
